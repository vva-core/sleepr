services:
  reservations:
    build:
      context: .
      dockerfile: apps/reservations/Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/reservations/node_modules
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy --config apps/reservations/prisma.config.ts && yarn start:dev reservations"
    env_file:
      - apps/reservations/.env
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/auth/node_modules
    command: sh -c "npx prisma migrate deploy --config apps/auth/prisma.config.ts && yarn start:dev auth"
    env_file:
      - apps/auth/.env
    depends_on:
      postgres:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: apps/payments/Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/payments/node_modules
    ports:
      - '50053:50053'
    command: sh -c "npx prisma migrate deploy --config apps/payments/prisma.config.ts && yarn start:dev payments"
    env_file:
      - apps/payments/.env
    depends_on:
      postgres:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/notifications/node_modules
    command: yarn start:dev notifications
    env_file:
      - apps/notifications/.env
    depends_on:
      - rabbitmq

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/gateway/node_modules
    ports:
      # transitional until the gateway fronts all traffic
      - '3003:3003'
    command: yarn start:dev gateway
    env_file:
      - apps/gateway/.env

  postgres:
    image: postgres:16
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - '8080:80'
    depends_on:
      - postgres
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    env_file:
      - .env

volumes:
  postgres_data:
