apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: reservations
  name: reservations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations
  strategy: {}
  template:
    metadata:
      labels:
        app: reservations
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - image: 805102730154.dkr.ecr.eu-north-1.amazonaws.com/sleepr/reservations:latest
          name: reservations
          env:
            - name: PORT
              value: '3000'
            - name: RESERVATIONS_GRPC_URL
              value: '0.0.0.0:50052'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: databaseUrl
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-url
                  key: rabbitmqUrl
          ports:
            - containerPort: 3000
            - containerPort: 50052
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
