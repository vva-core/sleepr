apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: reservations
  name: reservations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservations
  strategy: {}
  template:
    metadata:
      labels:
        app: reservations
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - image: 805102730154.dkr.ecr.eu-north-1.amazonaws.com/sleepr/reservations:latest
          name: reservations
          env:
            - name: PORT
              value: '3000'
            - name: AUTH_GRPC_URL
              value: 'auth-grpc:50051'
            - name: PAYMENTS_GRPC_URL
              value: 'payments-grpc:50053'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: databaseUrl
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-url
                  key: rabbitmqUrl
          ports:
            - containerPort: 3000
