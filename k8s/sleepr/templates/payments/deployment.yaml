apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: payments
  name: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: payments
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - image: 805102730154.dkr.ecr.eu-north-1.amazonaws.com/sleepr/payments:latest
          name: payments
          env:
            # Payments' own database — deliberately NOT the shared `database-url`
            # secret that auth and reservations read.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-database-url
                  key: databaseUrl
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: stripeSecretKey
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-url
                  key: rabbitmqUrl
            - name: PAYMENTS_GRPC_URL
              value: '0.0.0.0:50053'
